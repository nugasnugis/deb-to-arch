name: Convert DEB to Arch Package

on:
  workflow_dispatch:
    inputs:
      deb_url:
        description: 'Direct URL to the .deb package'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged 

    steps:
    # Set up system tools and download the official standalone debtap script directly
    - name: Setup Environment and Install Tools
      run: |
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syu --noconfirm --needed base-devel git wget zstd pkgfile
        
        # Download debtap directly from source into the global execution path
        wget -O /usr/bin/debtap https://githubusercontent.com
        chmod +x /usr/bin/debtap

    - name: Update Debtap Database
      run: |
        pkgfile -u
        debtap -u

    - name: Download and Convert Package
      run: |
        mkdir -p /workspace
        cd /workspace
        wget -O package.deb "${{ github.event.inputs.deb_url }}"
        # Automatically bypasses all configuration prompts as root
        yes "" | debtap package.deb

    - name: Install Node.js for Artifact Upload
      run: pacman -S --noconfirm nodejs

    - name: Upload Arch Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arch-package
        path: /workspace/*.pkg.tar.*
        if-no-files-found: error
