name: Convert DEB to Arch Package

on:
  workflow_dispatch:
    inputs:
      deb_url:
        description: 'Direct URL to the .deb package'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged 

    steps:
    # Removed the checkout and chown steps to completely avoid directory permission errors Tar up the build environment
     
    - name: Setup Environment and Build Dependencies
      run: |
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syu --noconfirm --needed base-devel git wget sudo pkgfile
        
        # Create builder user and map it cleanly
        useradd -m builder
        echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
        
    - name: Install fakeroot-tcp (Required for Docker containers)
      run: |
        sudo -u builder bash -c '
          cd /home/builder
          git clone https://archlinux.org
          cd fakeroot-tcp
          makepkg -si --noconfirm
        '

    - name: Install Debtap
      run: |
        sudo -u builder bash -c '
          cd /home/builder
          git clone https://archlinux.org
          cd debtap
          makepkg -si --noconfirm
        '

    - name: Update Debtap Database
      run: |
        pkgfile -u
        sudo -u builder debtap -u

    - name: Download and Convert Package
      run: |
        sudo -u builder bash -c '
          cd /home/builder
          wget -O package.deb "${{ github.event.inputs.deb_url }}"
          # Automatically bypasses configuration prompts
          yes "" | debtap package.deb
        '

    - name: Install Node.js for Artifact Upload
      run: pacman -S --noconfirm nodejs

    - name: Upload Arch Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arch-package
        # Targets the package right inside the builder's home directory
        path: /home/builder/*.pkg.tar.*
        if-no-files-found: error
