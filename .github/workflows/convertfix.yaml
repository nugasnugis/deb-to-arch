
name: Convert DEB to Arch Package

on:
  workflow_dispatch:
    inputs:
      deb_url:
        description: Direct URL to the .deb package
        required: true
        type: string

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Setup Environment
        shell: bash
        run: |
          set -euo pipefail

          pacman-key --init
          pacman-key --populate archlinux

          pacman -Syu --noconfirm --needed \
            base-devel \
            binutils \
            bash \
            git \
            curl \
            fakeroot \
            pkgfile \
            file

      - name: Install Debtap
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/helixarch/debtap/master/debtap \
            -o /usr/bin/debtap

          chmod 755 /usr/bin/debtap

          debtap --version

      - name: Update Debtap Database
        shell: bash
        run: |
          set -euo pipefail

          debtap -u

      - name: Download DEB
        shell: bash
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          set -euo pipefail

          mkdir -p /workspace/output
          cd /workspace

          curl -fL --retry 3 \
            "$DEB_URL" \
            -o package.deb

          test -s package.deb
          file package.deb

          # Reject non-DEB downloads
          ar t package.deb >/dev/null

      - name: Convert DEB to Arch Package
        shell: bash
        run: |
          set -euo pipefail
          cd /workspace

          # Non-interactive conversion.
          # -Q bypasses all questions.
          debtap -Q -o /workspace/output package.deb

          echo "Conversion finished."
          ls -lh /workspace/output/

          find /workspace/output \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.*' \
            -print -quit | grep -q .

      - name: Validate Arch Package
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(/workspace/output/*.pkg.tar.*)

          if (( ${#packages[@]} == 0 )); then
            echo "ERROR: No Arch package found."
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            echo "Checking: $pkg"
            pacman -Qip "$pkg"
          done

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: /workspace/output/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
